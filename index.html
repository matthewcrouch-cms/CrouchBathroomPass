<style>
:root{--bg:#eef5fb;--fg:#10202e;--card:#fff;--ac:#4B9CD3;--acf:#10202e;--or:#F56600;--mut:#566879;--ln:#d3e2ef;--hd:#4B9CD3}
@media(prefers-color-scheme:dark){:root{--bg:#0e1822;--fg:#eaf2f9;--card:#172635;--ln:#27415a;--mut:#9db3c6;--hd:#1d4f73}}
*{box-sizing:border-box}body{margin:0;font:16px system-ui,sans-serif;background:var(--bg);color:var(--fg)}
main{max-width:900px;margin:auto;padding:16px}h1{font-size:22px;margin:0 0 4px}.mut{color:var(--mut)}
.card{background:var(--card);border:1px solid var(--ln);border-radius:12px;padding:14px;margin:12px 0}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
button,select{font:inherit;border:1px solid var(--ln);background:var(--card);color:var(--fg);border-radius:10px;padding:10px 14px;cursor:pointer}
button.on{background:var(--ac);color:var(--acf);border-color:var(--ac);font-weight:600}button:disabled{opacity:.5;cursor:default}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:8px}
.big{width:100%;padding:18px;font-size:20px;font-weight:600}.go{background:var(--or);color:#10202e;border-color:var(--or)}
#app>.mut:first-child{margin:2px 0 12px}table{width:100%;border-collapse:collapse}th,td{padding:7px 8px;border-bottom:1px solid var(--ln);text-align:left;white-space:nowrap}th{font-size:13px;color:var(--mut)}footer{text-align:center;padding:18px}footer a{color:var(--mut);font-size:13px}header{background:var(--hd);border-bottom:5px solid var(--or);padding:10px 16px}header div{max-width:900px;margin:auto;display:flex;align-items:center;gap:14px}header img{height:64px;width:auto}header b{display:block;font-size:20px;color:#fff}header span{color:#fff;opacity:.9}.card{box-shadow:0 1px 3px rgba(16,32,46,.08)}
.stat{font-size:20px;font-weight:600;margin:6px 0}.long{color:#c62828;font-weight:700}.card.remind{background:#F56600;color:#fff;border-color:#F56600;animation:pulse 1.2s ease-in-out infinite}.card.remind .big{background:#fff;color:#B34700}@keyframes pulse{50%{box-shadow:0 0 0 10px rgba(245,102,0,.25)}}ol{margin:6px 0;padding-left:24px}li{padding:3px 0}.x{padding:2px 8px;margin-left:6px}
.pad{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;max-width:300px;margin:10px auto 0}.pad button{font-size:22px;padding:14px 0;font-weight:600}
.dots{display:flex;gap:12px;justify-content:center;margin:12px 0}.dots span{width:16px;height:16px;border-radius:50%;border:2px solid var(--ac)}.dots span.on{background:var(--ac)}

<script>
// Hall Pass on Supabase. Students use their homework login (same PIN). Every rule is checked by the database.
const SUPABASE_URL = "https://hfanndrvacddqvrvgmqe.supabase.co";
const SUPABASE_KEY = "sb_publishable_VElC8kqy_TL2yWPz7O33iQ_vQQaifXQ";
const POLL_MS = 4000;
// The homework platforms save their logins under these names (same github.io site, so this page can see them)
const APS_KEY = "aps_token", HW_KEY = "hw_token", APS_SEC_KEY = "aps_section";

const store = {
  get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } },
  set(k, v) { try { localStorage.setItem(k, v); } catch (e) {} },
  del(k) { try { localStorage.removeItem(k); } catch (e) {} }
};
const sstore = {
  get(k) { try { return sessionStorage.getItem(k); } catch (e) { return null; } },
  set(k, v) { try { sessionStorage.setItem(k, v); } catch (e) {} },
  del(k) { try { sessionStorage.removeItem(k); } catch (e) {} }
};
async function rpc(fn, args = {}) {
  const r = await fetch(`${SUPABASE_URL}/rest/v1/rpc/${fn}`, { method: "POST",
    headers: { apikey: SUPABASE_KEY, Authorization: `Bearer ${SUPABASE_KEY}`, "Content-Type": "application/json" }, body: JSON.stringify(args) });
  const t = await r.text(); let j = null; try { j = t ? JSON.parse(t) : null; } catch (e) {}
  if (!r.ok) throw new Error((j && (j.message || j.hint)) || "Network problem - try again");
  return j;
}
const $ = s => document.querySelector(s);
const el = (t, p = {}, ...k) => { const e = document.createElement(t); Object.assign(e, p); k.flat().forEach(c => c != null && c !== "" && e.append(c)); return e; };
const card = (...k) => el("div", { className: "card" }, ...k);
const mins = t => Math.max(0, Math.round((Date.now() + (S.skew || 0) - new Date(t).getTime()) / 6e4));   // uses the server clock
const fmtT = t => new Date(t).toLocaleTimeString("en-US", { hour: "numeric", minute: "2-digit", timeZone: "America/New_York" });
const nyDate = d => d.toLocaleDateString("en-US", { weekday: "long", month: "long", day: "numeric", timeZone: "America/New_York" });
const tokens = () => ({ p_aps: store.get(APS_KEY), p_hw: store.get(HW_KEY) });

let S = { mode: "student", st: null, pub: null, login: null, err: "", busy: false, sig: "",
          tpw: sstore.get("bp_tpw"), ts: null, sel: null, view: "pass", rep: { range: "7", cls: "all", data: null } };

// ---------------- polling ----------------
async function poll() {
  if (S.busy) return;
  try {
    if (S.mode === "teacher" && S.tpw) S.ts = await rpc("bp_teacher_state", { p_password: S.tpw });
    else if (S.mode === "student") {
      const t = tokens();
      S.st = (t.p_aps || t.p_hw) ? await rpc("bp_state", t) : { me: null };
      if (!S.st.me) S.pub = await rpc("bp_public");
    }
    const sv = (S.mode === "teacher" ? S.ts && S.ts.now : (S.st && S.st.now) || (S.pub && S.pub.now));
    if (sv) S.skew = new Date(sv).getTime() - Date.now();
    S.err = "";
  } catch (e) {
    if (S.mode === "teacher" && /password/i.test(e.message)) { S.tpw = null; sstore.del("bp_tpw"); S.err = e.message; }
    else S.err = "Can't reach the server. Check your connection.";
  }
  render();
}
async function act(f) {
  S.busy = true;
  try { const r = await f(); if (r && r.error) alert(r.error); else if (r && r.me !== undefined) S.st = r; }
  catch (e) { alert(e.message || "Network problem - try again"); }
  S.busy = false; S.sig = ""; poll();
}

// ---------------- student ----------------
function lineCard(st, teacher) {
  const q = st.queue || [], lim = st.out_limit || 1, early = st.window && st.window.early;
  const out = early ? [] : q.slice(0, lim), wait = early ? q : q.slice(lim);
  return card(el("div", { className: "stat" }, out.length ? "Out now: " : "Hall is clear ✅"),
    out.map(e => el("div", { className: mins(e.since) >= (st.remind_min || S.remind || 7) ? "long" : "" }, `${e.name} (${mins(e.since)} min)`,
      teacher ? el("button", { className: "x", textContent: "✓ back", onclick: () => act(() => rpc("bp_teacher_remove", { p_password: S.tpw, p_queue: e.id, p_back: true })) }) : "")),
    wait.length ? [el("div", { className: "mut" }, "In line:"), el("ol", {}, wait.map(e => el("li", {}, e.name,
      teacher ? el("button", { className: "x", textContent: "✕", onclick: () => act(() => rpc("bp_teacher_remove", { p_password: S.tpw, p_queue: e.id, p_back: false })) }) : "")))] : "");
}
function notMe() {
  // logs this Chromebook out of the hall pass AND homework (same login)
  const t = tokens();
  if (t.p_aps) rpc("aps_logout", { p_token: t.p_aps }).catch(() => {});
  if (t.p_hw) rpc("hw_logout", { p_token: t.p_hw }).catch(() => {});
  store.del(APS_KEY); store.del(HW_KEY); S.st = null; S.login = null; S.sig = ""; poll();
}
// Flash the tab title while a student has been out too long (their screen is waiting when they come back)
let flashT = null; const baseTitle = document.title;
function flashTitle(on) {
  if (on && !flashT) { let k = 0; flashT = setInterval(() => { document.title = (k++ % 2) ? baseTitle : "⏰ Tap I'm back!"; }, 1000); }
  if (!on && flashT) { clearInterval(flashT); flashT = null; document.title = baseTitle; }
}
function studentView(app) {
  const st = S.st;
  if (!st) return app.append(card("Loading…"));
  if (!st.me) { flashTitle(false); return loginView(app); }
  const w = st.window || {}, q = st.queue || [], lim = st.out_limit || 1, early = !!w.early;
  const i = q.findIndex(e => e.mine), mine = q[i];
  app.append(card(el("div", { className: "row" }, el("b", {}, `${st.me.name} · ${st.label}`),
    el("button", { textContent: "Not you?", onclick: () => { if (confirm("Log out of this Chromebook? (This also logs you out of homework.)")) notMe(); } }))));
  if (!w.insess && !mine) {
    return app.append(card(el("div", { className: "stat" }, w.meets ? "Your class isn't in session right now" : "No class today"),
      el("div", { className: "mut" }, w.next_t ? `${st.label} starts at ${w.next_t}.` : "Check back during class.")));
  }
  if (st.weekly_limit != null && st.cap != null) {
    const u = Math.min(st.used + (mine && i < lim && !early ? 1 : 0), st.cap);
    app.append(card(el("div", { className: "stat" }, "Passes this week: " + "●".repeat(u) + "○".repeat(Math.max(0, st.cap - u))),
      el("div", { className: "mut" }, `${u} of ${st.cap} used · resets Monday`)));
  }
  let box;
  const overdue = mine && i < lim && !early && mins(mine.since) >= (st.remind_min || 7);
  flashTitle(overdue);
  if (overdue) box = [el("div", { className: "stat" }, "⏰ Are you back?"),
    el("div", { style: "margin:4px 0 12px;font-size:17px" }, `You've been out for ${mins(mine.since)} minutes. If you're back in class, tap I'm back.`),
    el("button", { className: "big go", textContent: "I'm back", onclick: () => act(() => rpc("bp_leave", tokens())) })];
  else if (mine && i < lim && !early) box = [el("div", { className: "stat" }, "You're out 🚶 — tap when you're back"),
    el("button", { className: "big go", textContent: "I'm back", onclick: () => act(() => rpc("bp_leave", tokens())) })];
  else if (mine) {
    const first = early && i < lim;
    box = [el("div", { className: "stat" }, first ? `You're up first ⏳ — wait until ${w.t.replace("Passes open at ", "")}` : `You're #${early ? i + 1 : i - lim + 1} in line`),
      early ? el("div", { className: "mut", style: "margin:6px 0 10px" }, `${w.t}. Stay seated until then and this screen will update.`) : "",
      el("button", { className: "big", textContent: "Leave the line", onclick: () => act(() => rpc("bp_leave", tokens())) })];
  } else {
    const stop = st.weekly_limit != null && st.used >= st.cap;
    const can = (w.ok || early) && !st.paused && !stop, full = early || q.length >= lim;
    box = [el("button", { className: "big" + (can ? " on" : ""), disabled: !can, textContent: stop ? "No passes left this week" : full ? "Get in line" : "Request to go",
        onclick: () => act(() => rpc("bp_join", tokens())) }),
      el("div", { className: "mut", style: "margin-top:8px" }, stop ? `You've used all ${st.cap} passes for this week. They reset on Monday.`
        : st.paused ? "Passes are paused by your teacher right now" : early ? `You can get in line now, but wait until ${w.t.replace("Passes open at ", "")} to leave.` : w.t)];
  }
  const bx = card(...box); if (overdue) bx.classList.add("remind");
  app.append(bx, lineCard(st, false));
}

// Not logged in on this Chromebook: class in session → tap your name → homework PIN
function loginView(app) {
  const pub = S.pub; if (!pub) return app.append(card("Loading…"));
  const now = pub.classes.filter(c => c.window.insess);
  if (!S.login) {
    if (!now.length) {
      const nx = pub.classes.filter(c => c.window.next != null).sort((a, b) => a.window.next - b.window.next)[0];
      return app.append(card(el("div", { className: "stat" }, "No class in session right now"),
        el("div", { className: "mut" }, !pub.ab ? "There's no school today. See you next class day!" : nx ? `Next up: ${nx.label} at ${nx.window.next_t}` : "Classes are finished for today.")));
    }
    const c = now[0];
    S.login = { cls: c, names: null };
    (c.source === "aps" ? rpc("aps_students_list", { p_section: c.aps_section }) : rpc("hw_students_list"))
      .then(n => { S.login.names = n; S.sig = ""; render(); }).catch(e => { S.err = e.message; render(); });
  }
  const L = S.login;
  if (!L.names) return app.append(card("Loading names…"));
  if (!L.pick) {
    return app.append(card(el("div", { className: "stat" }, `${L.cls.label}: tap your name`),
      el("div", { className: "mut", style: "margin-bottom:10px" }, "Then type your homework PIN. You'll only need to do this once on your Chromebook."),
      el("div", { className: "grid" }, L.names.map(n => el("button", { textContent: n.name, onclick: () => { L.pick = n; L.pin = ""; L.msg = ""; S.sig = ""; render(); } })))));
  }
  const pad = el("div", { className: "pad" }, ["1","2","3","4","5","6","7","8","9","⌫","0","✕"].map(k => el("button", { textContent: k, onclick: () => key(k) })));
  const dots = el("div", { className: "dots" }, [0,1,2,3].map(i => el("span", { className: i < L.pin.length ? "on" : "" })));
  async function key(k) {
    if (k === "✕") { L.pick = null; S.sig = ""; return render(); }
    if (k === "⌫") L.pin = L.pin.slice(0, -1); else if (L.pin.length < 4) L.pin += k;
    S.sig = ""; render();
    if (L.pin.length === 4) {
      try {
        const r = L.cls.source === "aps" ? await rpc("aps_login", { p_student_id: L.pick.id, p_pin: L.pin })
                                         : await rpc("hw_login", { p_student_id: L.pick.id, p_pin: L.pin });
        if (!r || r.error || !r.token) throw new Error((r && r.error) || "Wrong PIN");
        if (L.cls.source === "aps") { store.set(APS_KEY, r.token); store.set(APS_SEC_KEY, L.cls.aps_section); } else store.set(HW_KEY, r.token);
        S.login = null; S.sig = ""; poll();
      } catch (e) { L.pin = ""; L.msg = e.message.replace(/^.*?:\s*/, ""); S.sig = ""; render(); }
    }
  }
  app.append(card(el("div", { className: "stat" }, `Hi, ${L.pick.name}! Type your homework PIN`), dots,
    L.msg ? el("div", { className: "bad" }, L.msg) : "", pad));
}

// ---------------- teacher ----------------
function teacherLogin(app) {
  const inp = el("input", { id: "pw", type: "password", placeholder: "Homework teacher password", className: "inp" });
  const go = async () => {
    try { S.ts = await rpc("bp_teacher_state", { p_password: inp.value }); S.skew = new Date(S.ts.now).getTime() - Date.now(); inp.blur(); S.tpw = inp.value; sstore.set("bp_tpw", inp.value); S.err = ""; S.sig = ""; render(); }
    catch (e) { inp.value = ""; inp.placeholder = "Wrong password"; }
  };
  inp.onkeydown = e => { if (e.key === "Enter") go(); };
  app.append(card(el("div", { className: "stat" }, "Teacher login"),
    el("div", { className: "mut", style: "margin-bottom:8px" }, "Use the same password as your homework teacher page."),
    el("div", { className: "row" }, inp, el("button", { className: "on", textContent: "Enter", onclick: go }),
      el("button", { textContent: "Cancel", onclick: () => { S.mode = "student"; history.replaceState(null, "", location.pathname); S.sig = ""; poll(); } }))));
  setTimeout(() => inp.focus(), 0);
}
function teacherView(app) {
  if (!S.tpw || !S.ts) return teacherLogin(app);
  if (S.view === "report") return reportView(app);
  const T = S.ts, cs = T.classes.filter(c => c.meets);
  if (!cs.length) app.append(card("No classes today."));
  if (!S.sel || !cs.some(c => c.class === S.sel)) S.sel = (cs.find(c => c.window.insess) || cs[0] || {}).class;
  app.append(el("div", { className: "row" }, cs.map(c => el("button", { className: c.class === S.sel ? "on" : "", textContent: c.label, onclick: () => { S.sel = c.class; S.sig = ""; render(); } }))));
  const c = cs.find(x => x.class === S.sel);
  const setCfg = o => act(() => rpc("bp_teacher_cfg", Object.assign({ p_password: S.tpw, p_paused: T.paused, p_out_limit: T.out_limit, p_sched: T.sched_override || "" }, o)));
  app.append(card(el("div", { className: "row" },
      el("button", { className: T.paused ? "on" : "", textContent: T.paused ? "▶ Resume passes" : "⏸ Pause passes", onclick: () => setCfg({ p_paused: !T.paused }) }),
      el("label", {}, "Out at once: ", el("select", { onchange: e => setCfg({ p_out_limit: +e.target.value }) }, [1, 2, 3].map(n => el("option", { value: n, textContent: n, selected: n === T.out_limit })))),
      el("label", {}, "Schedule today: ", el("select", { onchange: e => setCfg({ p_sched: e.target.value }) },
        [["", "Auto"], ["R", "Regular"], ["N", "No Homeroom"], ["E", "Early Release"]].map(([v, t]) => el("option", { value: v, textContent: t, selected: v === (T.sched_override || "") })))),
      el("button", { textContent: "📊 Reports", onclick: () => { S.view = "report"; S.rep.data = null; S.sig = ""; render(); loadLog(); } }),
      el("button", { textContent: "Log out", onclick: () => { S.tpw = null; S.ts = null; sstore.del("bp_tpw"); S.mode = "student"; history.replaceState(null, "", location.pathname); S.sig = ""; poll(); } })),
    c ? el("div", { className: "mut", style: "margin-top:8px" }, c.label + ": " + c.window.t + (T.paused ? " · PAUSED" : "")) : ""));
  if (!c) return;
  app.append(lineCard(Object.assign({ remind_min: T.remind_min }, c), true));
  if (c.weekly) app.append(card(el("div", { className: "stat" }, `Weekly passes · limit ${c.weekly_limit} (resets Monday)`),
    el("div", { style: "overflow-x:auto" }, el("table", {}, [...c.weekly].sort((a, b) => b.used / b.cap - a.used / a.cap || a.name.localeCompare(b.name)).map(r =>
      el("tr", {}, el("td", { textContent: r.name }), el("td", { textContent: `${r.used} / ${r.cap}`, style: r.used >= r.cap ? "color:#b34700;font-weight:700" : "" }),
        el("td", {}, el("button", { textContent: "+1 pass", onclick: () => act(() => rpc("bp_teacher_add_pass", { p_password: S.tpw, p_class: c.class, p_skey: r.skey })) }))))))));
}
async function loadLog() {
  try { S.rep.data = await rpc("bp_teacher_log", { p_password: S.tpw, p_from: null }); } catch (e) { S.rep.data = { classes: [], roster: [], log: [] }; }
  S.sig = ""; render();
}
const dl = (n, s) => el("a", { href: URL.createObjectURL(new Blob([s], { type: "text/csv" })), download: n }).click();
const pick = (o, cur, fn) => el("select", { onchange: e => fn(e.target.value) }, o.map(([v, t]) => el("option", { value: v, textContent: t, selected: v === cur })));
function reportView(app) {
  const R0 = S.rep, D = R0.data;
  if (!D) return app.append(card("Loading report…"));
  const today = S.ts.today, from = R0.range === "all" ? "" : new Date(new Date(today + "T12:00").getTime() - (+R0.range - 1) * 864e5).toISOString().slice(0, 10);
  const lab = Object.fromEntries(D.classes.map(c => [c.id, c.label])), rows = {};
  const log = D.log.filter(v => v.day >= from && (R0.cls === "all" || v.class === R0.cls));
  for (const v of log) { const id = v.class + "|" + v.skey, r = rows[id] || (rows[id] = { c: v.class, n: v.name, t: 0, m: 0, l: "" });
    r.t++; r.m += (new Date(v.back) - new Date(v.left)) / 6e4; if (v.day > r.l) r.l = v.day; }
  for (const s of D.roster) if (R0.cls === "all" || s.class === R0.cls) { const id = s.class + "|" + s.skey; rows[id] = rows[id] || { c: s.class, n: s.name, t: 0, m: 0, l: "" }; }
  const R = Object.values(rows).sort((a, b) => b.t - a.t || a.n.localeCompare(b.n)), tot = R.reduce((s, r) => s + r.t, 0);
  const sum = () => dl("hall-pass-summary.csv", ["student,class,trips,total_min,avg_min,last_trip"].concat(R.map(r => `"${r.n}",${r.c},${r.t},${r.m.toFixed(0)},${r.t ? (r.m / r.t).toFixed(1) : ""},${r.l}`)).join("\n"));
  const all = () => dl("hall-pass-log.csv", ["date,class,student,left,returned,minutes,auto_signed_in"].concat(D.log.map(v =>
    [v.day, v.class, `"${v.name}"`, fmtT(v.left), fmtT(v.back), ((new Date(v.back) - new Date(v.left)) / 6e4).toFixed(1), v.auto ? "yes" : ""].join(","))).join("\n"));
  app.append(card(el("div", { className: "row" }, el("button", { textContent: "← Back", onclick: () => { S.view = "pass"; S.sig = ""; render(); } }),
      pick([["1", "Today"], ["7", "Last 7 days"], ["30", "Last 30 days"], ["all", "All time"]], R0.range, v => { R0.range = v; S.sig = ""; render(); }),
      pick([["all", "All classes"]].concat(D.classes.map(c => [c.id, c.label])), R0.cls, v => { R0.cls = v; S.sig = ""; render(); }),
      el("button", { textContent: "Summary (CSV)", onclick: sum }), el("button", { textContent: "All trips (CSV)", onclick: all })),
    el("div", { className: "mut", style: "margin-top:8px" }, `${tot} trips · ${R.length} students · avg ${(tot / Math.max(1, R.length)).toFixed(1)} per student` + (log.some(v => v.auto) ? ` · ${log.filter(v => v.auto).length} signed back in automatically at the end of class` : ""))),
    card(el("div", { style: "overflow-x:auto" }, el("table", {}, el("tr", {}, ["Student", "Class", "Trips", "Total min", "Avg min", "Last trip"].map(h => el("th", { textContent: h }))),
      R.map(r => el("tr", {}, [r.n, lab[r.c] || r.c, r.t, r.m.toFixed(0), r.t ? (r.m / r.t).toFixed(1) : "–", r.l || "–"].map(v => el("td", { textContent: "" + v }))))))));
}

// ---------------- render ----------------
function render() {
  if (document.activeElement && document.activeElement.id === "pw") return;
  const s = JSON.stringify([S.mode, S.st, S.pub && S.pub.classes, S.login && [S.login.pick, S.login.pin, S.login.msg, !!S.login.names], S.err, S.ts, S.sel, S.view, S.rep.range, S.rep.cls, !!S.rep.data, Math.floor(Date.now() / 3e4)]);
  if (s === S.sig) return; S.sig = s;
  const srvNow = (S.mode === "teacher" && S.ts && S.ts.now) || (S.st && S.st.now) || (S.pub && S.pub.now);
  const app = $("#app"), d = srvNow ? new Date(srvNow) : new Date(), info = S.mode === "teacher" && S.ts ? S.ts : null;
  const ab = info ? info.ab : S.st && S.st.window ? S.st.window.ab : S.pub ? S.pub.ab : null;
  const sch = info ? info.sched_names[info.sched] : S.st && S.st.window ? ({ R: "Regular", N: "No Homeroom", E: "Early Release" })[S.st.window.sched] : null;
  app.replaceChildren(el("div", { className: "mut" }, nyDate(d) + (ab ? ` · ${ab}-Day` + (sch ? ` · ${sch} schedule` : "") : (S.st || S.pub || info) ? " · No school today" : "")));
  if (S.err) app.append(card(S.err));
  if (S.mode === "teacher") teacherView(app); else studentView(app);
}
function route() { S.mode = location.hash === "#teacher" ? "teacher" : "student"; S.sig = ""; poll(); }
addEventListener("hashchange", route);
$("#tl").onclick = e => { e.preventDefault(); location.hash = "#teacher"; };
route();
setInterval(() => { if (!document.hidden) poll(); }, POLL_MS);
addEventListener("visibilitychange", () => { if (!document.hidden) poll(); });
addEventListener("storage", e => { if (e.key === APS_KEY || e.key === HW_KEY) poll(); });   // logged in/out in the homework tab
</script></body></html>
