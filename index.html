<style>
:root{--bg:#eef5fb;--fg:#10202e;--card:#fff;--ac:#4B9CD3;--acf:#10202e;--or:#F56600;--mut:#566879;--ln:#d3e2ef;--hd:#4B9CD3}
@media(prefers-color-scheme:dark){:root{--bg:#0e1822;--fg:#eaf2f9;--card:#172635;--ln:#27415a;--mut:#9db3c6;--hd:#1d4f73}}
*{box-sizing:border-box}body{margin:0;font:16px system-ui,sans-serif;background:var(--bg);color:var(--fg)}
main{max-width:900px;margin:auto;padding:16px}h1{font-size:22px;margin:0 0 4px}.mut{color:var(--mut)}
.card{background:var(--card);border:1px solid var(--ln);border-radius:12px;padding:14px;margin:12px 0}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
button,select{font:inherit;border:1px solid var(--ln);background:var(--card);color:var(--fg);border-radius:10px;padding:10px 14px;cursor:pointer}
button.on{background:var(--ac);color:var(--acf);border-color:var(--ac);font-weight:600}button:disabled{opacity:.5;cursor:default}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:8px}
.big{width:100%;padding:18px;font-size:20px;font-weight:600}.go{background:var(--or);color:#10202e;border-color:var(--or)}
#app>.mut:first-child{margin:2px 0 12px}table{width:100%;border-collapse:collapse}th,td{padding:7px 8px;border-bottom:1px solid var(--ln);text-align:left;white-space:nowrap}th{font-size:13px;color:var(--mut)}footer{text-align:center;padding:18px}footer a{color:var(--mut);font-size:13px}header{background:var(--hd);border-bottom:5px solid var(--or);padding:10px 16px}header div{max-width:900px;margin:auto;display:flex;align-items:center;gap:14px}header img{height:64px;width:auto}header b{display:block;font-size:20px;color:#fff}header span{color:#fff;opacity:.9}.card{box-shadow:0 1px 3px rgba(16,32,46,.08)}

const T=s=>{const[h,m]=s.split(":");return +h*60+ +m},fmt=m=>{const h=Math.floor(m/60);return (h>12?h-12:h)+":"+p2(Math.round(m%60))};
